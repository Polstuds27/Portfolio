<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paul Mojal — full-stack developer (React, TypeScript, Django). Offline-first apps, lab systems, and local-AI tooling. Bulacan State University CICT." />
    <meta name="theme-color" content="#F8F7F5" />
    <title>Paul Mojal — Developer Portfolio</title>
    <script>
      // Prevent theme flash: read persisted theme before paint
      try {
        var t = localStorage.getItem("pm-theme");
        var dark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.classList.remove("no-js");
      } catch (e) {}
    </script>

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
